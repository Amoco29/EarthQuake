spring.application.name=EarthQuakeFaker

# H2 en mémoire : la base est recréée à chaque démarrage (niveaux rechargés depuis niveaux.json)
spring.datasource.url=jdbc:h2:mem:earthquakefaker
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
